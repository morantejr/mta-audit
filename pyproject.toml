[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mta-audit"
version = "0.1.2"
description = "Reliability audits for multi-touch attribution data and models."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "mta-audit contributors" }]
keywords = ["attribution", "marketing-analytics", "data-quality", "audit"]
dependencies = [
  # NumPy 2.5+ requires Python 3.12 and its stubs use PEP 695 syntax. Keep one
  # stub-compatible line while mypy checks the library's Python 3.11 minimum.
  "numpy>=1.26,<2.5",
  "pandas>=2.1",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

[project.optional-dependencies]
viz = [
  "matplotlib>=3.8",
]
parquet = [
  "pyarrow>=15",
]
dev = [
  "matplotlib>=3.8",
  "mypy>=1.11",
  "pandas-stubs>=2.1",
  "pyarrow>=15",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/morantejr/mta-audit"
Documentation = "https://github.com/morantejr/mta-audit/tree/main/docs"
Issues = "https://github.com/morantejr/mta-audit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mta_audit"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/examples",
  "/benchmarks",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/pyproject.toml",
  "/uv.lock",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config --cov=mta_audit --cov-report=term-missing"
testpaths = ["tests"]
markers = [
  "criteo: requires the public Criteo Attribution Modeling dataset",
]

[tool.uv]
required-version = ">=0.11.23,<0.12"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["examples", "benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
files = ["src/mta_audit"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
# pandas-stubs intentionally models heterogeneous frames conservatively; these
# codes otherwise obscure useful package-level checks with dataframe false positives.
disable_error_code = [
  "arg-type",
  "assignment",
  "attr-defined",
  "call-overload",
  "misc",
  "operator",
  "union-attr",
  "unused-ignore",
]

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
